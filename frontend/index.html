<!doctype html>
<html lang="az" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/it25patok-logo-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="İT25 PATOK — İT25A1 və İT25A2 üçün qapalı tədris platforması" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="İT25 PATOK" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>İT25 PATOK</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('it25-theme') || 'system';
          var dark = saved === 'dark' || (saved === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) { /* tema oxuna bilmədi */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
