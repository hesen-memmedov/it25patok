<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>İT25 PATOK — Fayl müddəti xəbərdarlığı</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:Inter,Arial,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f7;padding:32px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(79,70,229,.12);">
                <tr>
                    <td style="background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:28px 36px;">
                        <div style="font-size:22px;font-weight:800;color:#ffffff;">İT25 <span style="opacity:.8;font-weight:500;">PATOK</span></div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:36px;">
                        <p style="margin:0 0 8px;font-size:14px;color:#6b7280;">Salam, <strong th:text="${name}">İstifadəçi</strong>!</p>
                        <h1 style="margin:0 0 12px;font-size:24px;color:#111827;">Fayllarınızın müddəti bitir</h1>
                        <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#4b5563;">
                            Platformada saxlanılan aşağıdakı fayllar 30 gün ərzində avtomatik silinəcək.
                            Lazımdırsa, onları cihazınıza yükləyib saxlayın.
                        </p>
                        <div th:each="file : ${files}" style="border:1px solid #f3f4f6;border-radius:12px;padding:12px 16px;margin-bottom:8px;">
                            <div style="font-size:14px;font-weight:600;color:#111827;" th:text="${file.name}">fayl.pdf</div>
                            <div style="font-size:12px;color:#6b7280;margin-top:4px;">Silinmə tarixi: <span th:text="${file.expires}">—</span></div>
                        </div>
                        <a th:href="${baseUrl}" style="display:inline-block;margin-top:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#ffffff;text-decoration:none;font-weight:700;font-size:14px;padding:14px 26px;border-radius:12px;">
                            Saytda aç
                        </a>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 36px;background:#f9fafb;border-top:1px solid #f3f4f6;">
                        <p style="margin:0;font-size:12px;color:#9ca3af;">İT25 PATOK · <a th:href="${baseUrl}" style="color:#6366f1;text-decoration:none;" th:text="${baseUrl}">it25patok.pages.dev</a></p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
