server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

spring:
  application:
    name: it25-patok-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Baku
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 200MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  thymeleaf:
    check-template-location: true
  cache:
    type: caffeine

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Mail göndərişi async + retry ilədir; liveness buna bağlanmamalıdır
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  base-url: ${APP_BASE_URL:https://it25patok.pages.dev}
  emailjs:
    # EmailJS (https://www.emailjs.com) — OTP məktubları üçün (boşdursa: dev outbox / SMTP)
    service-id: ${APP_EMAILJS_SERVICE_ID:}
    template-id: ${APP_EMAILJS_TEMPLATE_ID:}
    public-key: ${APP_EMAILJS_PUBLIC_KEY:}
    private-key: ${APP_EMAILJS_PRIVATE_KEY:}
    website: ${APP_EMAILJS_WEBSITE:https://it25patok.pages.dev}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://it25patok.pages.dev,http://localhost:5173}
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:None}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-change-me-please-32b}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    issuer: it25patok
  d1:
    mode: ${D1_MODE:cloudflare}
    account-id: ${CF_ACCOUNT_ID:}
    database-id: ${CF_D1_DATABASE_ID:}
    api-token: ${CF_API_TOKEN:}
    local-path: ${D1_LOCAL_PATH:./.data/it25patok.db}
    timeout-seconds: ${D1_TIMEOUT_SECONDS:20}
  storage:
    mode: ${STORAGE_MODE:drive}
    local-root: ${LOCAL_STORAGE_ROOT:./.data/files}
  drive:
    root-folder-id: ${DRIVE_ROOT_FOLDER_ID:}
    service-account-json: ${GOOGLE_SERVICE_ACCOUNT_JSON:}
    service-account-file: ${GOOGLE_SERVICE_ACCOUNT_FILE:}
    application-name: IT25 PATOK
  mail:
    dev-mode: ${MAIL_DEV_MODE:false}
    dev-outbox: ${MAIL_DEV_OUTBOX:./.data/outbox}
    from-name: İT25 PATOK
    from-address: ${MAIL_USERNAME:no-reply@it25patok.az}
    brevo-api-key: ${BREVO_API_KEY:}
    daily-batch-pause-ms: ${MAIL_BATCH_PAUSE_MS:1000}
  otp:
    ttl-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-per-hour: 5
    block-minutes: 15
  chat:
    encryption-key: ${CHAT_ENCRYPTION_KEY:}
    key-version: ${CHAT_KEY_VERSION:1}
    old-keys: ${CHAT_KEYS_OLD:}
    retention-days: 7
    max-length: 2000
  files:
    expiry-days: 365
    warning-days: 30
    conversion-dir: ${CONVERSION_DIR:./.data/previews}
    office-binary: ${SOFFICE_BINARY:soffice}
    conversion-timeout-seconds: ${CONVERSION_TIMEOUT_SECONDS:120}
  admin:
    email: ${ADMIN_EMAIL:admin@it25patok.az}
    initial-password: ${ADMIN_INITIAL_PASSWORD:Admin123!IT25}
  trust-proxy: ${TRUST_PROXY:false}
  timezone: Asia/Baku

logging:
  level:
    root: INFO
    az.it25patok: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
